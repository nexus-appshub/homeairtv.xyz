name: Categorize Home Air TV playlist

on:
  push:
    paths-ignore:
      - 'hmairtv.m3u8'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  categorize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Categorize every channel by group-title
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('hmairtv.m3u8')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)

          # Priority matters: specific categories are checked before broad ones.
          rules = [
              ('Sports', [
                  'sport', 'sports', 'ten sports', 'sony sports', 'bein', 'espn',
                  'eurosport', 't sports', 'star sports', 'sky sport', 'supersport',
                  'willow', 'cricbuzz', 'cricket', 'football', 'soccer', 'fifa',
                  'uefa', 'nfl', 'nba', 'nhl', 'mlb', 'wwe', 'tennis', 'golf',
                  'formula 1', 'f1', 'motorsport', 'olympic'
              ]),
              ('Movies', [
                  'movie', 'movies', 'cinema', 'film', 'films', 'hbo', 'star gold',
                  'zee cinema', 'sony max', 'sony pix', 'colors cineplex',
                  'and pictures', 'b4u movies', 'bollywood', 'hollywood',
                  'romedy now', 'movies now', 'mx play'
              ]),
              ('Kids', [
                  'kids', 'cartoon', 'nick', 'nickelodeon', 'discovery kids',
                  'pogo', 'hungama', 'baby tv', 'baby', 'junior', 'toon',
                  'disney junior', 'disney xd', 'animax'
              ]),
              ('Teens', [
                  'teen', 'teens', 'mtv', 'vh1', '9xm', 'zoom', 'music india'
              ]),
              ('News', [
                  'news', 'cnn', 'bbc news', 'al jazeera', 'france 24', 'euronews',
                  'republic', 'ndtv', 'aaj tak', 'times now', 'india today',
                  'wion', 'news18', 'cnbc', 'bloomberg'
              ]),
              ('Music', [
                  'music', 'mtv', 'vh1', '9xm', 'zoom', 'b4u music', 'mastiii',
                  'songs', 'radio'
              ]),
              ('Religious', [
                  'islam', 'islamic', 'quran', 'madani', 'peace tv', 'muslim',
                  'christ', 'christian', 'gospel', 'church', 'hindu', 'sanatan',
                  'shiva', 'temple', 'religious'
              ]),
              ('International', [
                  'international', 'world', 'dw ', 'dw-', 'dw news', 'bbc',
                  'cgtn', 'nhk', 'trt', 'rt ', 'rt news', 'sky news',
                  'france 24', 'al jazeera', 'euronews', 'africa', 'asia',
                  'america', 'canada', 'australia', 'pakistan', 'bangladesh',
                  'india', 'uk ', 'uk tv', 'usa', 'us ', 'germany', 'german',
                  'french', 'spanish', 'arabic', 'turkish', 'japanese', 'korean'
              ]),
              ('Family', [
                  'family', 'sony aath', 'entertainment', 'colors', 'zee tv',
                  'star plus', 'star jalsha', 'zee bangla', 'bangla', 'channel i',
                  'ntv', 'atn', 'ekattor', 'gazi tv', 'r tv', 'boishakhi',
                  'desh tv', 'dbc', 'machranga', 'ananda', 'zee anmol'
              ]),
          ]

          def category_for(name):
              value = name.lower().strip()
              for category, keywords in rules:
                  if any(k in value for k in keywords):
                      return category
              return 'Family'

          out = []
          changed = 0
          extinf_re = re.compile(r'^(#EXTINF:[^\n]*?)(?:group-title="[^"]*")([^\n]*)(?:\n|$)')

          for line in lines:
              if not line.startswith('#EXTINF:'):
                  out.append(line)
                  continue

              # Channel display name is everything after the final comma.
              display = line.split(',', 1)[1].strip() if ',' in line else ''
              category = category_for(display)

              if 'group-title="' in line:
                  new_line = re.sub(r'group-title="[^"]*"', f'group-title="{category}"', line, count=1)
              else:
                  # Insert group-title immediately before the channel display name.
                  if ',' in line:
                      left, right = line.split(',', 1)
                      new_line = f'{left} group-title="{category}",{right}'
                  else:
                      new_line = line

              if new_line != line:
                  changed += 1
              out.append(new_line)

          updated = ''.join(out)
          if updated == text:
              print('No playlist category changes needed.')
          else:
              path.write_text(updated, encoding='utf-8')
              print(f'Categorized {changed} channel entries.')
          PY

      - name: Commit and push playlist update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hmairtv.m3u8
          if git diff --cached --quiet; then
            echo 'Playlist already categorized.'
            exit 0
          fi
          git commit -m 'Categorize playlist channels by group'
          git push
